<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Система подбора рецептов</title>
    <style>
        :root {
            --bg-main: #f5f5f7;
            --bg-card: #ffffff;
            --text-primary: #1d1d1f;
            --text-secondary: #86868b;
            --accent: #0071e3;
            --border: #d2d2d7;
            --success: #34c759;
            --warning: #ff9500;
        }
        * { box-sizing: border-box; transition: all 0.2s ease-in-out; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0; padding: 40px 20px; background-color: var(--bg-main); color: var(--text-primary);
            -webkit-font-smoothing: antialiased;
        }
        .container { max-width: 1100px; margin: 0 auto; }
        .header { display: flex; justify-content: flex-end; margin-bottom: 40px; border-bottom: 1px solid var(--border); padding-bottom: 20px; }
        .btn-reset { background: none; border: 1px solid var(--border); color: var(--text-primary); padding: 8px 16px; border-radius: 18px; font-size: 14px; font-weight: 500; cursor: pointer; }
        .btn-reset:hover { background: var(--text-primary); color: var(--bg-card); border-color: var(--text-primary); }
        .section-title { font-size: 20px; font-weight: 600; margin: 40px 0 20px 0; letter-spacing: -0.2px; }
        .ingredients-panel { background: var(--bg-card); border-radius: 20px; padding: 30px; border: 1px solid rgba(0,0,0,0.04); box-shadow: 0 4px 24px rgba(0,0,0,0.02); }
        .tags-grid { display: flex; flex-wrap: wrap; gap: 10px; }
        .tag-checkbox { cursor: pointer; }
        .tag-checkbox input { display: none; }
        .tag-text { display: inline-block; padding: 10px 20px; background: var(--bg-main); border-radius: 20px; font-size: 14px; font-weight: 500; color: #424245; border: 1px solid transparent; }
        .tag-checkbox input:checked + .tag-text { background: var(--text-primary); color: var(--bg-card); }
        .recipes-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 25px; min-height: 50px; }
        .recipe-card { background: var(--bg-card); border-radius: 18px; padding: 24px; display: flex; flex-direction: column; justify-content: space-between; border: 1px solid rgba(0,0,0,0.05); box-shadow: 0 4px 18px rgba(0,0,0,0.01); cursor: pointer; position: relative; animation: fadeIn 0.3s ease-in-out forwards; opacity: 0; transform: translateY(10px); }
        @keyframes fadeIn { to { opacity: 1; transform: translateY(0); } }
        .recipe-card:hover { transform: translateY(-4px); box-shadow: 0 12px 30px rgba(0,0,0,0.05); border-color: var(--border); }
        .status-badge { position: absolute; top: 24px; right: 24px; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
        .status-badge.ready { color: var(--success); }
        .status-badge.almost { color: var(--warning); }
        .recipe-name { font-size: 20px; font-weight: 600; margin: 0 0 12px 0; max-width: 75%; line-height: 1.2; }
        .recipe-desc { font-size: 14px; font-weight: 500; color: var(--text-primary); margin-bottom: 12px; line-height: 1.4; }
        .recipe-summary { font-size: 14px; color: var(--text-secondary); line-height: 1.5; margin-bottom: 20px; }
        .missing-info { font-size: 13px; font-weight: 500; color: #ff3b30; border-top: 1px dashed var(--border); padding-top: 12px; margin-top: auto; }
        .empty-message { color: var(--text-secondary); font-size: 15px; grid-column: 1 / -1; padding: 10px 0; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); justify-content: center; align-items: center; z-index: 1000; opacity: 0; }
        .modal.active { display: flex; opacity: 1; }
        .modal-content { background: var(--bg-card); width: 100%; max-width: 600px; max-height: 85vh; border-radius: 24px; padding: 40px; overflow-y: auto; box-shadow: 0 20px 40px rgba(0,0,0,0.15); transform: scale(0.95); }
        .modal.active .modal-content { transform: scale(1); }
        .modal-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 24px; }
        .modal-close { background: var(--bg-main); border: none; width: 36px; height: 36px; border-radius: 50%; font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .modal-close:hover { background: var(--border); }
        .modal-title { font-size: 26px; font-weight: 700; margin: 0; }
        .modal-section { margin-top: 24px; }
        .modal-section-title { font-size: 16px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-secondary); margin-bottom: 12px; }
        .modal-list { padding-left: 20px; margin: 0; line-height: 1.6; font-size: 15px; }
        .modal-steps { padding-left: 20px; margin: 0; line-height: 1.7; font-size: 15px; }
        .modal-steps li { margin-bottom: 10px; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <button class="btn-reset" onclick="resetAll()">Сбросить выбор</button>
    </div>
    <div class="ingredients-panel">
        <div class="section-title" style="margin-top:0;">Доступные ингредиенты:</div>
        <div class="tags-grid" id="ingredients-container"></div>
    </div>
    <div class="section-title">Можно приготовить сейчас</div>
    <div class="recipes-grid" id="container-ready"></div>
    <div class="section-title">Не хватает 1-2 ингредиентов</div>
    <div class="recipes-grid" id="container-almost"></div>
</div>
<div class="modal" id="recipe-modal" onclick="closeModal(event)">
    <div class="modal-content" onclick="event.stopPropagation()">
        <div class="modal-header">
            <h2 class="modal-title" id="m-title">Название рецепта</h2>
            <button class="modal-close" onclick="closeModal()">×</button>
        </div>
        <div class="modal-section">
            <div class="modal-section-title">Ингредиенты и граммовки</div>
            <ul class="modal-list" id="m-ingredients"></ul>
        </div>
        <div class="modal-section">
            <div class="modal-section-title">Технология приготовления</div>
            <ol class="modal-steps" id="m-steps"></ol>
        </div>
    </div>
</div>

<script>
        const recipes = [
        { name: "Классический блинчики", desc: "Тонкие, кружевные домашние блинчики по классическому рецепту.", ing: ["Молоко", "Яйца", "Растительное масло", "Мука", "Сахар"], weights: ["700 мл", "3 шт.", "3 ст. л.", "300 г", "3 ст. л."], steps: ["В глубокой миске взбейте яйца с сахаром и щепоткой соли до появления легкой пены.", "Влейте примерно треть теплого молока, перемешайте и постепенно просейте всю муку, замешивая густое однородное тесто без комочков.", "Постепенно влейте оставшееся молоко, постоянно помешивая венчиком. Добавьте растительное масло и дайте тесту постоять 10-15 минут.", "Хорошо раскалите сковороду, смажьте её маслом перед первым блином. Выпекайте блины на среднем огне по 1-2 минуты с каждой стороны до золотистого цвета."] },
        { name: "Жульен с курицей и грибами", desc: "Нежная курица и ароматные шампиньоны в насыщенном сливочном соусе под сырной корочкой.", ing: ["Куриное филе", "Грибы шампиньоны", "Лук репчатый", "Сливки", "Сыр твёрдый", "Растительное масло"], weights: ["400 г", "300 г", "100 г", "200 мл", "150 г", "2 ст.л."], steps: ["Отварите куриное филе в подсоленной воде до готовности (20 минут), остудите и нарежьте мелкими кубиками или разберите на волокна.", "Шампиньоны нарежьте тонкими пластинками, лук мелко нашинкуйте.", "На сковороде с растительным маслом обжарьте лук до прозрачности, добавьте грибы и жарьте до полного испарения влаги (7-10 минут). Добавьте курицу, посолите и поперчите по вкусу.", "Влейте в сковороду сливки, доведите до кипения и томите на медленном огне 3-5 минут до легкого загустения.", "Разложите массу по кокотницам или в общую форму для запекания, обильно посыпав сверху тертым твердым сыром.", "Запекайте в духовке, разогретой до 180°C, примерно 10-15 минут, пока сыр полностью не расплавится и не образуется румяная корочка. Подача: украсьте свежим базиликом или салатными листьями."] },
        { name: "Макароны с куриными фрикадельками", desc: "Аппетитные мясные шарики в густом пряном соусе из томатов.", ing: ["Спагетти", "Фарш куриный", "Лук репчатый", "Чеснок", "Яйца", "Томатная паста", "Растительное масло"], weights: ["200 г", "250 г", "2 шт.", "4 зубчика", "1 желток", "2 ч.л.", "3 ст.л."], steps: ["В куриный фарш добавьте один измельченный лук, 2 зубчика пропущенного через пресс чеснока, яичный желток, соль и перец. Тщательно вымесите фарш и слегка отбейте его о миску.", "Сформируйте небольшие фрикадельки размером с грецкий орех.", "В глубокой сковороде разогрейте растительное масло и обжарьте фрикадельки со всех сторон до золотистой корочки (около 5-7 минут), затем аккуратно переложите их на тарелку.", "В той же сковороде обжарьте второй мелко нарезанный лук и оставшийся чеснок. Добавьте томатную пасту, влейте 150 мл теплой воды, посолите и тушите соус 3 минуты.", "Верните фрикадельки в соус, накройте крышкой и тушите на слабом огне 15 минут.", "Параллельно отварите макароны в кипящей подсоленной воде согласно инструкции на упаковке. Слейте воду, выложите макароны на тарелки, сверху добавьте фрикадельки с соусом. Подача: украсьте веточками свежей зелени."] },
        { name: "Яичные конвертики с сыром и ветчиной", desc: "Быстрый, сытный и оригинальный завтрак из яичных блинчиков с начинкой.", ing: ["Яйца", "Ветчина", "Сыр твёрдый", "Растительное масло"], weights: ["4 шт.", "130 г", "100 г", "2 ч.л."], steps: ["Ветчину нарежьте тонкими полосками или мелкой соломкой. Сыр натрите на крупной терке.", "Каждое яйцо взбивайте по отдельности в небольшой чашке с щепоткой соли с помощью вилки.", "Разогрейте сковороду, слегка смажьте растительным маслом. Вылейте одно взбитое яйцо, распределяя его по дну сковороды как блинчик.", "Как только яичный блинчик схватится, выложите по центру немного ветчины и сыра.", "С помощью лопатки сверните блинчик с четырех сторон к центру, формируя квадратный конвертик.", "Переверните конвертик швом вниз и обжаривайте еще 1 минуту, чтобы сыр внутри полностью расплавился. Повторите процесс для остальных яиц. Подача: украсьте свежей петрушкой."] },
        { name: "Манные биточки", desc: "Нежные сладкие биточки из густой манной каши с хрустящей корочкой, вкус как в детстве.", ing: ["Молоко", "Крупа манная", "Мука", "Яйца", "Растительное масло", "Сахар"], weights: ["500 мл", "160 г", "2 ст.л.", "1 шт.", "40 мл", "60 г"], steps: ["В кастрюлю влейте молоко, добавьте сахар, ванилин и щепотку соли. Доведите до кипения.", "Тонкой струйкой, постоянно помешивая венчиком, всыпьте манную крупу, чтобы не образовались комки.", "Варите кашу на минимальном огне до сильного загустения (около 5 минут), непрерывно помешивая ложкой. Снимите с огня и остудите до теплого состояния.", "В теплую манную массу вбейте яйцо и тщательно перемешайте до однородности.", "Влажными руками сформируйте небольшие круглые биточки, обваляйте их со всех сторон в муке.", "Разогрейте сковороду с растительным маслом и обжаривайте манные биточки на среднем огне по 3-4 минуты с каждой стороны до появления красивой румяной корочки. Подавайте теплыми."] },
        { name: "Сборная мясная солянка", desc: "Густой, наваристый, сытный суп с богатым мясным вкусом и приятной кислинкой.", ing: ["Колбаса копченая", "Сосиски", "Куриное филе", "Лук репчатый", "Огурцы солёные", "Маслины", "Томатная паста", "Растительное масло"], weights: ["200 г", "2 шт.", "100 г", "2 шт.", "2 шт.", "12 шт.", "2 ст.л.", "2 ст.л."], steps: ["Заранее отварите куриное филе в кипящей воде до готовности (20 минут). Выньте мясо, остудите и нарежьте соломкой. Бульон не выливайте.", "Копченую колбасу и сосиски нарежьте тонкими брусочками или кружочками.", "Солёные огурцы нарежьте мелкой соломкой или кубиками. Лук мелко нашинкуйте.", "На сковороде с растительным маслом обжарьте лук до золотистого цвета, добавьте томатную пасту и тушите на медленном огне 2 минуты.", "В кипящий мясной бульон (при необходимости добавьте воду до объема 1.2 литра) переложите обжаренный лук с томатом, нарезанные огурцы и все мясные продукты (колбасу, сосиски, курицу). Варите на слабом огне 10-15 минут.", "За 5 минут до окончания варки добавьте в суп маслины, нарезанные кружочками. Посолите по вкусу.", "Выключите огонь и дайте солянке настояться под крышкой 10 минут. Подача: в каждую тарелку положите ломтик лимона, ложку густой сметаны и посыпьте свежей рубленой зеленью."] },
        { name: "Куриный суп с вермишелью", desc: "Классический, легкий и прозрачный суп для всей семьи.", ing: ["Куриное филе", "Картофель", "Морковь", "Лук репчатый", "Вермишель", "Растительное масло"], weights: ["500 г", "3 шт.", "1 шт.", "1 шт.", "100 г", "2 ст.л."], steps: ["Куриное филе промойте, нарежьте небольшими порционными кусочками, залейте в кастрюле 2 литрами холодной воды. Добавьте лавровый лист.", "Доведите до кипения, тщательно снимите образовавшуюся пену. Убавьте огонь и варите бульон 20 минут.", "Картофель очистите и нарежьте кубиками, морковь натрите на средней терке, лук мелко измельчите.", "Добавьте картофель в кастрюлю к курице и варите 10 минут.", "На сковороде с маслом обжарьте лук и морковь до мягкости (5 минут), затем переложите зажарку в суп.", "Всыпьте вермишель, посолите и поперчите суп по вкусу, аккуратно перемешайте. Варите еще 5 минут на слабом огне, пока вермишель не станет мягкой. Подача: посыпьте свежей петрушкой."] },
        { name: "Куриный суп с клёцками", desc: "Ароматный домашний суп на наваристом курином бульоне с нежными воздушными клецками.", ing: ["Куриное филе", "Картофель", "Лук репчатый", "Морковь", "Яйца", "Мука", "Растительное масло"], weights: ["300 г", "3 шт.", "1 шт.", "0.5 шт.", "1 шт.", "60 г", "30 мл"], steps: ["Куриные голени или филе залейте 1.6 л воды, доведите до кипения, снимите пену и варите на медленном огне 30 минут. Выньте мясо, отделите от костей и верните в бульон.", "Картофель нарежьте кубиками и отправьте в кипящий бульон.", "Лук и морковь мелко нарежьте, обжарьте на сковороде с растительным маслом до мягкости и переложите в кастрюлю к картофелю.", "Для клецок: в небольшой миске взбейте яйцо со щепоткой соли, постепенно всыпьте муку, тщательно вымешивая ложкой до получения вязкого, густого теста.", "Когда картофель станет мягким, уменьшите огонь до минимума. Чайную ложку обмакните в горячий бульон, наберите пол-ложки теста и опустите в суп. Тесто само отделится. Повторите со всем тестом.", "Варите суп еще 3-5 минут после того, как все клёцки всплывут на поверхность. Посолите по вкусу. Подача: посыпьте свежей петрушкой."] },
        { name: "Курица под соусом терияки", desc: "Сочные кусочки куриного филе в глазури из густого пикантного соуса с кунжутом.", ing: ["Куриное филе", "Сливки", "Растительное масло"], weights: ["300 г", "150 г", "30 мл"], steps: ["Куриное филе промойте, обсушите бумажным полотенцем и нарежьте небольшими тонкими полосками или кубиками на один укус.", "На сковороде хорошо разогрейте растительное масло. Выложите кусочки курицы в один слой.", "Обжаривайте филе на сильном огне, постоянно помешивая лопаткой, в течение 5-7 минут до появления легкой золотистой корочки.", "Убавьте огонь до среднего, влейте в сковороду соус терияки (если он идет с кунжутом — отлично, если кунжут отдельно — всыпьте его сейчас). Тщательно перемешайте, чтобы соус полностью покрыл каждый кусочек мяса.", "Прогревайте курицу в соусе еще 3-5 минут на медленном огне. Соус должен слегка закипеть, загустеть и превратиться в блестящую глазурь. Подавайте горячим."] },
        { name: "Жаркое со свининой", desc: "Сытное, сочное и невероятно ароматное домашнее жаркое из мяса и картофеля.", ing: ["Картофель", "Фарш куриный", "Лук репчатый", "Чеснок", "Растительное масло"], weights: ["800 г", "600 г", "120 г", "2 зубчика", "3 ст.л."], steps: ["Свинину промойте, обсушите и нарежьте средними кубиками. Картофель очистите и нарежьте крупными дольками. Лук нарежьте полукольцами, чеснок измельчите.", "В глубокой сковороде или казане разогрейте растительное масло. Выложите мясо и обжаривайте на сильном огне до испарения сока и появления румяной корочки (около 10 минут).", "Добавьте к мясу лук, перемешайте и жарьте вместе еще 5 минут.", "Выложите в казан картофель, добавьте сухую паприку, кориандр, гранулированный чеснок, соль и черный перец. По желанию добавьте целый острый перец.", "Влейте около 150-200 мл теплой воды, накройте казан крышкой, уменьшите огонь до минимума и тушите жаркое около 35-40 минут до полной мягкости картофеля и мяса.", "В самом конце добавьте свежий измельченный чеснок, перемешайте и выключите огонь. Подача: посыпьте красным луком, свежей зеленью и зернами граната."] },
        { name: "Классический омлет", desc: "Нежный французский завтрак для идеального начала дня.", ing: ["Яйца", "Молоко", "Сливочное масло"], weights: ["3 шт.", "50 мл", "10 г"], steps: ["Взбейте яйца с молоком.", "Растопите масло.", "Готовьте под крышкой 5 минут."] },
        { name: "Яичница с томатами", desc: "Простое и сочное блюдо на скорую руку.", ing: ["Яйца", "Помидоры", "Растительное масло"], weights: ["2 шт.", "1 шт.", "10 мл"], steps: ["Обжарьте помидоры кубиками.", "Вбейте яйца.", "Посолите, готовьте до готовности."] },
        { name: "Картофельное пюре", desc: "Классический воздушный гарнир со сливочным вкусом.", ing: ["Картофель", "Молоко", "Сливочное масло"], weights: ["100 г", "150 мл", "50 г"], steps: ["Отварите картофель.", "Добавьте горячее молоко и масло.", "Разомните до однородности."] },

        { name: "Рис с курицей", desc: "Быстрое полноценное горячее блюдо в одной сковороде.", ing: ["Рис", "Куриное филе", "Морковь", "Лук репчатый"], weights: ["200 г", "300 г", "1 шт.", "1 шт."], steps: ["Обжарьте курицу и овощи.", "Добавьте рис, залейте водой 1:2.", "Тушите под крышкой 20 минут."] },
        { name: "Сырники", desc: "Идеальные нежные сырники с золотистой корочкой.", ing: ["Творог", "Яйца", "Мука", "Сливочное масло"], weights: ["400 г", "1 шт.", "3 ст.л.", "20 г"], steps: ["Смешайте творог, яйцо и муку.", "Сформируйте сырники.", "Обжаривайте по 5 минут с каждой стороны."] },
        { name: "Салат с крабовыми палочками", desc: "Классический праздничный салат из крабовых палочек и сладкой кукурузы.", ing: ["Крабовые палочки", "Кукуруза консервированная", "Яйца", "Сливки"], weights: ["200 г", "1 банка", "3 шт.", "2 ст.л."], steps: ["Нарежьте крабовые палочки и отварные яйца кубиками.", "Слейте жидкость из кукурузы.", "Заправьте соусом (майонезом/сливками), посолите и перемешайте."] },{ name: "Гренки с сыром и чесноком", desc: "Хрустящие, пикантные чесночные гренки под сырной корочкой.", ing: ["Хлеб", "Сыр твёрдый", "Чеснок", "Сливки"], weights: ["4 ломтика", "80 г", "1 зубчик", "1 ст.л."], steps: ["Обжарьте хлеб на сухой сковороде.", "Смешайте тертый сыр, измельченный чеснок и немного сливок.", "Намажьте массу на горячие гренки."] },
        { name: "Куриные наггетсы", desc: "Хрустящие домашние наггетсы из сочного куриного филе.", ing: ["Куриное филе", "Яйца", "Мука", "Растительное масло"], weights: ["400 г", "1 шт.", "4 ст.л.", "50 мл"], steps: ["Нарежьте филе кусочками, посолите.", "Обваляйте в муке, обмакните во взбитое яйцо.", "Обжаривайте в раскаленном масле до корочки."] },
        { name: "Горячие бутерброды", desc: "Мини-пиццы на хлебе с томатами и тягучим сыром.", ing: ["Хлеб", "Сыр твёрдый", "Помидоры"], weights: ["4 ломтика", "100 г", "1 шт."], steps: ["Нарежьте томаты тонкими кружочками.", "Выложите на хлеб томаты, сверху закройте сыром.", "Запекайте в печи или микроволновке до расплавления сыра."] },
        { name: "Быстрый суп с клецками", desc: "Легкий домашний овощной суп с мягким яичным тестом.", ing: ["Картофель", "Морковь", "Лук репчатый", "Яйца", "Мука"], weights: ["3 шт.", "1 шт.", "1 шт.", "1 шт.", "3 ст.л."], steps: ["Сварите овощной бульон из картофеля, лука и моркови.", "Для клецок взбейте яйцо с солью и мукой.", "Ложкой опускайте тесто в суп, варите 5 минут."] },{ name: "Кабачковые оладьи", desc: "Нежные, сочные и легкие летние оладьи из кабачков.", ing: ["Кабачки", "Яйца", "Мука", "Растительное масло"], weights: ["1 шт.", "1 шт.", "3 ст.л.", "30 мл"], steps: ["Натрите кабачок, сильно отожмите сок.", "Добавьте яйцо и муку, перемешайте.", "Выкладывайте ложкой на сковороду, жарьте с двух сторон."] },
        { name: "Салат с курицей и кукурузой", desc: "Простой повседневный салат с отварной птицей.", ing: ["Куриное филе", "Кукуруза консервированная", "Яйца", "Сливки"], weights: ["300 г", "1 банка", "3 шт.", "2 ст.л."], steps: ["Отварите курицу и яйца, нарежьте кубиками.", "Добавьте кукурузу без сока.", "Заправьте соусом, посолите и перемешайте."] },
        { name: "Жареные макароны с яйцом", desc: "Быстрый студенческий ужин из остатков макарон.", ing: ["Спагетти", "Яйца", "Сливочное масло"], weights: ["200 г", "2 шт.", "20 г"], steps: ["Отварите макароны, выложите на сковороду с маслом.", "Вбейте яйца прямо в макароны.", "Активно перемешивайте лопаткой до готовности яиц."] }    
    ];

    // Списки для распределения по категориям
    const cats = {
        base: ["Яйца", "Молоко", "Картофель", "Куриное филе", "Фарш куриный", "Спагетти", "Рис", "Гречневая крупа", "Творог", "Колбаса копченая", "Сосиски"],
        veg: ["Помидоры", "Лук репчатый", "Морковь", "Кабачки", "Капуста", "Чеснок", "Листья салата", "Огурцы солёные"]
    };

    const allIngredients = [...new Set(recipes.flatMap(r => r.ing))].sort();
    const container = document.getElementById('ingredients-container');
    container.innerHTML = ''; // Очищаем старую разметку

    // Создаем три аккуратных визуальных блока под группы
    const htmlGroups = {
        base: { title: "Основные продукты", ings: [] },
        veg: { title: "Овощи и зелень", ings: [] },
        other: { title: "Разное и специи", ings: [] }
    };

    allIngredients.forEach(ing => {
        if (cats.base.includes(ing)) htmlGroups.base.ings.push(ing);
        else if (cats.veg.includes(ing)) htmlGroups.veg.ings.push(ing);
        else htmlGroups.other.ings.push(ing);
    });

    Object.keys(htmlGroups).forEach(key => {
        const group = htmlGroups[key];
        if (group.ings.length > 0) {
            let groupHTML = `<div style="width:100%; margin-bottom:15px;"><strong style="font-size:14px; color:var(--text-secondary); text-transform:uppercase; letter-spacing:0.5px;">${group.title}</strong></div>`;
            group.ings.forEach(ing => {
                groupHTML += `
                    <label class="tag-checkbox">
                        <input type="checkbox" value="${ing}" onchange="filterRecipes()">
                        <span class="tag-text">${ing}</span>
                    </label>
                `;
            });
            container.innerHTML += `<div class="tags-grid" style="width:100%; margin-bottom:25px;">${groupHTML}</div>`;
        }
    });

    function filterRecipes() {
        const checked = Array.from(document.querySelectorAll('input[type="checkbox"]:checked')).map(el => el.value);
        const containerReady = document.getElementById('container-ready');
        const containerAlmost = document.getElementById('container-almost');
        containerReady.innerHTML = '';
        containerAlmost.innerHTML = '';

        if (checked.length === 0) {
            const msg = '<div class="empty-message">Отметьте имеющиеся продукты для старта поиска...</div>';
            containerReady.innerHTML = msg;
            containerAlmost.innerHTML = msg;
            return;
        }

        let hasReady = false; let hasAlmost = false;

        recipes.forEach((recipe, index) => {
            const missing = recipe.ing.filter(i => !checked.includes(i));
            const cardHTML = `
                <div class="recipe-card" onclick="openModal(${index})">
                    <span class="status-badge ${missing.length === 0 ? 'ready' : 'almost'}">
                        ${missing.length === 0 ? 'Доступно' : 'Купить: ' + missing.length}
                    </span>
                    <h3 class="recipe-name">${recipe.name}</h3>
                    ${recipe.desc ? `<div class="recipe-desc">${recipe.desc}</div>` : ''}
                    <div class="recipe-summary">Состав: ${recipe.ing.join(', ')}</div>
                    ${missing.length > 0 ? `<div class="missing-info">Нужно купить: ${missing.join(', ')}</div>` : ''}
                </div>
            `;
            if (missing.length === 0) { containerReady.innerHTML += cardHTML; hasReady = true; }
            else if (missing.length <= 2) { containerAlmost.innerHTML += cardHTML; hasAlmost = true; }
        });

        if (!hasReady) containerReady.innerHTML = '<div class="empty-message">Нет рецептов из выбранных продуктов.</div>';
        if (!hasAlmost) containerAlmost.innerHTML = '<div class="empty-message">Нет подходящих рецептов.</div>';
    }

    function openModal(index) {
        const recipe = recipes[index];
        document.getElementById('m-title').innerText = recipe.name;
        const ingList = document.getElementById('m-ingredients');
        ingList.innerHTML = '';
        recipe.ing.forEach((ing, i) => { ingList.innerHTML += `<li><strong>${ing}</strong> — ${recipe.weights[i]}</li>`; });
        const stepList = document.getElementById('m-steps');
        stepList.innerHTML = '';
        recipe.steps.forEach(step => { stepList.innerHTML += `<li>${step}</li>`; });
        document.getElementById('recipe-modal').classList.add('active');
    }

    function closeModal() { document.getElementById('recipe-modal').classList.remove('active'); }
    
    function resetAll() {
        document.querySelectorAll('input[type="checkbox"]').forEach(el => el.checked = false);
        filterRecipes();
    }

    filterRecipes();
</script>
</body>
</html>
