<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Система подбора рецептов</title>
    <style>
        :root {
            --bg-main: #f5f5f7;
            --bg-card: #ffffff;
            --text-primary: #1d1d1f;
            --text-secondary: #86868b;
            --accent: #0071e3;
            --border: #d2d2d7;
            --success: #34c759;
            --warning: #ff9500;
        }
        * { box-sizing: border-box; transition: all 0.2s ease-in-out; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0; padding: 40px 20px; background-color: var(--bg-main); color: var(--text-primary);
            -webkit-font-smoothing: antialiased;
        }
        .container { max-width: 1100px; margin: 0 auto; }
        .header { display: flex; justify-content: flex-end; margin-bottom: 40px; border-bottom: 1px solid var(--border); padding-bottom: 20px; }
        .btn-reset { background: none; border: 1px solid var(--border); color: var(--text-primary); padding: 8px 16px; border-radius: 18px; font-size: 14px; font-weight: 500; cursor: pointer; }
        .btn-reset:hover { background: var(--text-primary); color: var(--bg-card); border-color: var(--text-primary); }
        .section-title { font-size: 20px; font-weight: 600; margin: 40px 0 20px 0; letter-spacing: -0.2px; }
        .ingredients-panel { background: var(--bg-card); border-radius: 20px; padding: 30px; border: 1px solid rgba(0,0,0,0.04); box-shadow: 0 4px 24px rgba(0,0,0,0.02); }
        .tags-grid { display: flex; flex-wrap: wrap; gap: 10px; }
        .tag-checkbox { cursor: pointer; }
        .tag-checkbox input { display: none; }
        .tag-text { display: inline-block; padding: 10px 20px; background: var(--bg-main); border-radius: 20px; font-size: 14px; font-weight: 500; color: #424245; border: 1px solid transparent; }
        .tag-checkbox input:checked + .tag-text { background: var(--text-primary); color: var(--bg-card); }
        .recipes-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 25px; min-height: 50px; }
        .recipe-card { background: var(--bg-card); border-radius: 18px; padding: 24px; display: flex; flex-direction: column; justify-content: space-between; border: 1px solid rgba(0,0,0,0.05); box-shadow: 0 4px 18px rgba(0,0,0,0.01); cursor: pointer; position: relative; animation: fadeIn 0.3s ease-in-out forwards; opacity: 0; transform: translateY(10px); }
        @keyframes fadeIn { to { opacity: 1; transform: translateY(0); } }
        .recipe-card:hover { transform: translateY(-4px); box-shadow: 0 12px 30px rgba(0,0,0,0.05); border-color: var(--border); }
        .status-badge { position: absolute; top: 24px; right: 24px; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
        .status-badge.ready { color: var(--success); }
        .status-badge.almost { color: var(--warning); }
        .recipe-name { font-size: 20px; font-weight: 600; margin: 0 0 12px 0; max-width: 75%; line-height: 1.2; }
        .recipe-summary { font-size: 14px; color: var(--text-secondary); line-height: 1.5; margin-bottom: 20px; }
        .missing-info { font-size: 13px; font-weight: 500; color: #ff3b30; border-top: 1px dashed var(--border); padding-top: 12px; margin-top: auto; }
        .empty-message { color: var(--text-secondary); font-size: 15px; grid-column: 1 / -1; padding: 10px 0; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); justify-content: center; align-items: center; z-index: 1000; opacity: 0; }
        .modal.active { display: flex; opacity: 1; }
        .modal-content { background: var(--bg-card); width: 100%; max-width: 600px; max-height: 85vh; border-radius: 24px; padding: 40px; overflow-y: auto; box-shadow: 0 20px 40px rgba(0,0,0,0.15); transform: scale(0.95); }
        .modal.active .modal-content { transform: scale(1); }
        .modal-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 24px; }
        .modal-close { background: var(--bg-main); border: none; width: 36px; height: 36px; border-radius: 50%; font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .modal-close:hover { background: var(--border); }
        .modal-title { font-size: 26px; font-weight: 700; margin: 0; }
        .modal-section { margin-top: 24px; }
        .modal-section-title { font-size: 16px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-secondary); margin-bottom: 12px; }
        .modal-list { padding-left: 20px; margin: 0; line-height: 1.6; font-size: 15px; }
        .modal-steps { padding-left: 20px; margin: 0; line-height: 1.7; font-size: 15px; }
        .modal-steps li { margin-bottom: 10px; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <button class="btn-reset" onclick="resetAll()">Сбросить выбор</button>
    </div>
    <div class="ingredients-panel">
        <div class="section-title" style="margin-top:0;">Доступные ингредиенты:</div>
        <div class="tags-grid" id="ingredients-container"></div>
    </div>
    <div class="section-title">Можно приготовить сейчас</div>
    <div class="recipes-grid" id="container-ready"></div>
    <div class="section-title">Не хватает 1-2 ингредиентов</div>
    <div class="recipes-grid" id="container-almost"></div>
</div>
<div class="modal" id="recipe-modal" onclick="closeModal(event)">
    <div class="modal-content" onclick="event.stopPropagation()">
        <div class="modal-header">
            <h2 class="modal-title" id="m-title">Название рецепта</h2>
            <button class="modal-close" onclick="closeModal()">×</button>
        </div>
        <div class="modal-section">
            <div class="modal-section-title">Ингредиенты и граммовки</div>
            <ul class="modal-list" id="m-ingredients"></ul>
        </div>
        <div class="modal-section">
            <div class="modal-section-title">Технология приготовления</div>
            <ol class="modal-steps" id="m-steps"></ol>
        </div>
    </div>
</div>

<script>
    const recipes = [
        { name: "Классический омлет", ing: ["Яйца", "Молоко", "Сливочное масло"], weights: ["3 шт.", "50 мл", "10 г"], steps: ["Взбейте яйца с молоком.", "Растопите масло.", "Готовьте под крышкой 5 минут."] },
        { name: "Яичница с томатами", ing: ["Яйца", "Помидоры", "Растительное масло"], weights: ["2 шт.", "1 шт.", "10 мл"], steps: ["Обжарьте помидоры кубиками.", "Вбейте яйца.", "Посолите, готовьте до готовности."] },
        { name: "Картофельное пюре", ing: ["Картофель", "Молоко", "Сливочное масло"], weights: ["1 кг", "150 мл", "50 г"], steps: ["Отварите картофель.", "Добавьте горячее молоко и масло.", "Разомните до однородности."] },
        { name: "Жареный картофель", ing: ["Картофель", "Растительное масло", "Лук"], weights: ["500 г", "30 мл", "1 шт."], steps: ["Нарежьте картофель брусочками.", "Жарьте 15 минут.", "Добавьте лук, жарьте до корочки."] },
        { name: "Салат Цезарь", ing: ["Куриное филе", "Листья салата", "Сухарики", "Помидоры", "Сыр"], weights: ["200 г", "50 г", "30 г", "50 г", "20 г"], steps: ["Обжарьте филе кусочками.", "Нарежьте овощи.", "Смешайте, посыпьте сухариками и сыром."] },
        { name: "Куриный суп", ing: ["Куриное филе", "Картофель", "Морковь", "Лук"], weights: ["400 г", "3 шт.", "1 шт.", "1 шт."], steps: ["Сварите куриный бульон.", "Добавьте картофель.", "Сделайте зажарку из лука и моркови, варите 15 мин."] },
        { name: "Паста Карбонара", ing: ["Спагетти", "Бекон", "Яйца", "Сыр"], weights: ["200 г", "100 г", "2 шт.", "40 г"], steps: ["Отварите спагетти.", "Обжарьте бекон.", "Смешайте желтки с сыром, соедините с горячей пастой."] },
        { name: "Овсяная каша", ing: ["Овсяные хлопья", "Молоко", "Сливочное масло"], weights: ["100 г", "300 мл", "15 г"], steps: ["Вскипятите молоко.", "Всыпьте хлопья, варите 5 минут.", "Добавьте сливочное масло."] },
        { name: "Гречка с луком", ing: ["Гречневая крупа", "Лук", "Растительное масло"], weights: ["200 г", "1 шт.", "20 мл"], steps: ["Отварите гречку.", "Обжарьте мелко нарезанный лук.", "Смешайте гречку с луком."] },
        { name: "Рис с курицей", ing: ["Рис", "Куриное филе", "Морковь", "Лук"], weights: ["200 г", "300 г", "1 шт.", "1 шт."], steps: ["Обжарьте курицу и овощи.", "Добавьте rice, залейте водой 1:2.", "Тушите под крышкой 20 минут."] },
        { name: "Драники", ing: ["Картофель", "Яйца", "Мука", "Растительное масло"], weights: ["500 г", "1 шт.", "2 ст.л.", "30 мл"], steps: ["Натереть картофель, отжать сок.", "Добавить яйцо и муку.", "Жарить на масле до корочки."] },
        { name: "Блины классические", ing: ["Мука", "Молоко", "Яйца", "Растительное масло"], weights: ["200 г", "500 мл", "2 шт.", "20 мл"], steps: ["Взбейте яйца с молоком.", "Постепенно всыпьте муку.", "Выпекайте на раскаленной сковороде."] },
        { name: "Сырники", ing: ["Творог", "Яйца", "Мука", "Сливочное масло"], weights: ["400 г", "1 шт.", "3 ст.л.", "20 г"], steps: ["Смешайте творог, яйцо и муку.", "Сформируйте сырники.", "Обжаривайте по 5 минут с каждой стороны."] },
        { name: "Макароны по-флотски", ing: ["Спагетти", "Фарш", "Лук", "Растительное масло"], weights: ["250 г", "300 г", "1 шт.", "20 мл"], steps: ["Отварите спагетти.", "Обжарьте фарш с луком.", "Соедините всё вместе, прогрейте 2 минуты."] },
        { name: "Запеченный картофель", ing: ["Картофель", "Чеснок", "Растительное масло"], weights: ["600 г", "3 зубчика", "30 мл"], steps: ["Нарежьте картофель дольками.", "Смешайте с маслом и чесноком.", "Запекайте при 200°C 35 минут."] }
    ];
    const allIngredients = [...new Set(recipes.flatMap(r => r.ing))].sort();
    const container = document.getElementById('ingredients-container');
    
    allIngredients.forEach(ing => {
        container.innerHTML += `
            <label class="tag-checkbox">
                <input type="checkbox" value="${ing}" onchange="filterRecipes()">
                <span class="tag-text">${ing}</span>
            </label>
        `;
    });

    function filterRecipes() {
        const checked = Array.from(document.querySelectorAll('input[type="checkbox"]:checked')).map(el => el.value);
        const containerReady = document.getElementById('container-ready');
        const containerAlmost = document.getElementById('container-almost');
        containerReady.innerHTML = '';
        containerAlmost.innerHTML = '';

        if (checked.length === 0) {
            const msg = '<div class="empty-message">Отметьте имеющиеся продукты для старта поиска...</div>';
            containerReady.innerHTML = msg;
            containerAlmost.innerHTML = msg;
            return;
        }

        let hasReady = false; let hasAlmost = false;

        recipes.forEach((recipe, index) => {
            const missing = recipe.ing.filter(i => !checked.includes(i));
            const cardHTML = `
                <div class="recipe-card" onclick="openModal(${index})">
                    <span class="status-badge ${missing.length === 0 ? 'ready' : 'almost'}">
                        ${missing.length === 0 ? 'Доступно' : 'Купить: ' + missing.length}
                    </span>
                    <h3 class="recipe-name">${recipe.name}</h3>
                    <div class="recipe-summary">Состав: ${recipe.ing.join(', ')}</div>
                    ${missing.length > 0 ? `<div class="missing-info">Нужно купить: ${missing.join(', ')}</div>` : ''}
                </div>
            `;
            if (missing.length === 0) { containerReady.innerHTML += cardHTML; hasReady = true; }
            else if (missing.length <= 2) { containerAlmost.innerHTML += cardHTML; hasAlmost = true; }
        });

        if (!hasReady) containerReady.innerHTML = '<div class="empty-message">Нет рецептов из выбранных продуктов.</div>';
        if (!hasAlmost) containerAlmost.innerHTML = '<div class="empty-message">Нет подходящих рецептов.</div>';
    }

    function openModal(index) {
        const recipe = recipes[index];
        document.getElementById('m-title').innerText = recipe.name;
        const ingList = document.getElementById('m-ingredients');
        ingList.innerHTML = '';
        recipe.ing.forEach((ing, i) => { ingList.innerHTML += `<li><strong>${ing}</strong> — ${recipe.weights[i]}</li>`; });
        const stepList = document.getElementById('m-steps');
        stepList.innerHTML = '';
        recipe.steps.forEach(step => { stepList.innerHTML += `<li>${step}</li>`; });
        document.getElementById('recipe-modal').classList.add('active');
    }

    function closeModal() { document.getElementById('recipe-modal').classList.remove('active'); }
    
    function resetAll() {
        document.querySelectorAll('input[type="checkbox"]').forEach(el => el.checked = false);
        filterRecipes();
    }

    filterRecipes();
</script>
</body>
</html>
